<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TruthGuard Settings</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body class="settings-page">
    <main class="panel">
      <header class="topbar"><div class="brand"><span class="brand-mark">TG</span><span>TruthGuard</span></div></header>
      <section class="intro"><p class="eyebrow">CONNECTION</p><h1>Backend settings</h1></section>
      <section class="settings-card">
        <label for="api-url">TRUTHGUARD BACKEND URL</label>
        <input id="api-url" type="url" placeholder="http://localhost:5000" autocomplete="url">
        <p>Use your deployed HTTPS backend URL, or the address where your local TruthGuard server is running.</p>
        <div class="settings-actions"><button id="save" class="primary" type="button">Save URL</button><button id="test" class="secondary" type="button">Test connection</button></div>
        <p id="status" class="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
